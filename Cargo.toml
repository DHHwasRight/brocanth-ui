[workspace]
resolver = "2"
members = ["crates/brocanth-ui", "examples/gallery"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
brocanth-ui = { path = "crates/brocanth-ui", version = "0.1.0" }
# Same source as brocanth and d3set-ssr. Two sources give two `Template` traits.
# The brocanth asset pipeline: `assets!` embeds and fingerprints files,
# `brocanth-bundle` runs rolldown from build.rs.
brocanth-assets = { git = "https://github.com/DHHwasRight/brocanth.git", branch = "main", version = "0.1.0" }
brocanth-bundle = { git = "https://github.com/DHHwasRight/brocanth.git", branch = "main", version = "0.1.0" }
rsx = { git = "https://github.com/DHHwasRight/rsx.git", branch = "main", version = "0.1.0" }
