# Builds the gallery, checks it in headless Chromium, and publishes it to
# GitHub Pages at https://dhhwasright.github.io/brocanth-ui/. brocanth-static
# writes every page as a document and as partials for dp-swap, with the
# /brocanth-ui base path on every URL.
name: Gallery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: Playwright 1.60 has no browsers for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Rust 1.98, the Tailwind CLI and Node, pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      # Under the Pages base path, into a folder with the same name, so the
      # browser checks see the site exactly as Pages serves it.
      - name: Export the gallery
        run: GALLERY_BASE=/brocanth-ui cargo run -p gallery -- target/site/brocanth-ui

      - name: Install the browser-test tools
        run: |
          npm ci
          npx playwright-core install --with-deps chromium-headless-shell webkit

      - name: Check the gallery in headless Chromium
        run: |
          python3 -m http.server -d target/site 4100 >/dev/null 2>&1 &
          sleep 1
          GALLERY_URL=http://localhost:4100/brocanth-ui/ node tests/browser.mjs

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: target/site/brocanth-ui

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
