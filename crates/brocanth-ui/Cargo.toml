[package]
name = "brocanth-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Design-system components for brocanth apps: rsx markup, Tailwind classes, Zag.js glue for stateful parts."
publish = false

[features]
# Rebuild the committed assets: Tailwind CSS and the rolldown glue bundle.
# Only the brocanth-ui repo turns it on (mise tasks do). An app gets the
# committed files and compiles neither rolldown nor Node packages.
rebuild-assets = ["dep:brocanth-bundle"]
# The Chart component: d3set-ssr, which also brings jt from git.
charts = ["dep:d3set-ssr"]

[dependencies]
brocanth-assets.workspace = true
d3set-ssr = { workspace = true, optional = true }
rsx.workspace = true

[build-dependencies]
brocanth-bundle = { workspace = true, optional = true }
