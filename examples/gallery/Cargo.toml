[package]
name = "gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Renders every component twice, under the shadcn theme and the Stripe docs theme, to static files."

[dependencies]
brocanth-ui = { workspace = true, features = ["charts"] }
rsx.workspace = true
# Code highlighting with TextMate grammars and VS Code themes, as in the d3set gallery.
giallo = { version = "0.5", features = ["dump"] }
