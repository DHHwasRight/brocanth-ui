[package]
name = "gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Renders every component twice, under the shadcn theme and the original theme, to static files."

[dependencies]
brocanth-ui = { workspace = true, features = ["charts"] }
rsx.workspace = true
# Code highlighting with TextMate grammars and VS Code themes, as in the d3set gallery.
giallo = { version = "0.5", features = ["dump"] }
# The export: brocanth-static writes every page as a document and as one
# partial per layout depth, for dp-swap, through the gallery's own handler.
brocanth-static = { git = "https://github.com/DHHwasRight/brocanth.git", branch = "main" }
brocanth-server = { git = "https://github.com/DHHwasRight/brocanth.git", branch = "main" }
brocanth = { git = "https://github.com/DHHwasRight/brocanth.git", branch = "main" }
tokio = { version = "1", features = ["rt"] }
# The Utilities tab's index (data/utilities.json).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
